name: Build and Deploy Backend to Render

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image to GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/tumimurim-backend:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Trigger Render deploy (optional)
        if: secrets.RENDER_DEPLOY_HOOK
        run: |
          echo "Triggering Render deploy hook"
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Done
        run: echo "Build and deploy steps completed"
